name: Preview Cleanup

# Quando o PR é fechado (mergeado ou não), apaga os previews da branch na Vercel
# e os registros de deploy no GitHub, para a lista de previews não crescer sem parar.
# pull_request_target roda a versão da main e nunca faz checkout do código do PR.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete Vercel Preview Deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN ou VERCEL_PROJECT_ID não configurados; previews da Vercel não foram apagados."
            exit 0
          fi

          API=https://api.vercel.com
          TEAM_QS=${VERCEL_TEAM_ID:+&teamId=$VERCEL_TEAM_ID}
          BRANCH_QS=$(jq -rn --arg b "$BRANCH" '$b | @uri')

          # Cada página traz até 100; repete enquanto ainda houver deploys de preview da branch
          for _ in $(seq 1 20); do
            IDS=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$API/v7/deployments?projectId=$VERCEL_PROJECT_ID&branch=$BRANCH_QS&limit=100$TEAM_QS" \
              | jq -r '.deployments[] | select(.target != "production") | .uid')
            [ -z "$IDS" ] && break

            for ID in $IDS; do
              curl -fsS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "$API/v13/deployments/$ID?${TEAM_QS#&}" > /dev/null
              echo "Apagado: $ID"
            done
          done

      - name: Delete GitHub Deployment Records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          for SHA in $(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].sha'); do
            for ID in $(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" \
              --jq '.[] | select(.environment | test("^production"; "i") | not) | .id'); do
              # O GitHub só deixa apagar um deploy depois de marcá-lo como inativo
              gh api -X POST "repos/$REPO/deployments/$ID/statuses" -f state=inactive > /dev/null
              gh api -X DELETE "repos/$REPO/deployments/$ID"
              echo "Removido do GitHub: deployment $ID ($SHA)"
            done
          done

      - name: Mark Preview Comment as Removed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          MARKER='<!-- preview-comment -->'
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n1)
          [ -z "$COMMENT_ID" ] && exit 0

          printf '%s\n## 🧹 Preview removido\n\nO PR foi fechado e o preview desta branch foi apagado.\n' "$MARKER" > body.md
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@body.md > /dev/null
