name: Deploy Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'

permissions:
  contents: read

# Two merges in a row push migrations one after the other, never at the same time
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        # Sem `version`, o v3 usa a versão do CLI fixada no package-lock.json.
        # Fixada por SHA: esse job tem o token de produção do Supabase
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1

      - name: Link Project
        # A senha vai pelo env (o CLI lê SUPABASE_DB_PASSWORD), não pela linha de comando
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Create Symlink for Supabase CLI
        # Isso engana o CLI fazendo-o achar que as migrations estão no lugar "padrão"
        run: |
          mkdir -p supabase
          ln -s ../database/migrations ./supabase/migrations

      - name: Deploy Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
