name: Deploy Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'

permissions:
  contents: read

# Two merges in a row push migrations one after the other, never at the same time
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        # Sem `version`, o v3 usa a versão do CLI fixada no package-lock.json.
        # Fixada por SHA: esse job tem o token de produção do Supabase
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0

      - name: Link Project
        # A senha vai pelo env (o CLI lê SUPABASE_DB_PASSWORD), não pela linha de comando
        run: supabase link "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Create Symlink for Supabase CLI
        # Isso engana o CLI fazendo-o achar que as migrations estão no lugar "padrão"
        run: |
          mkdir -p supabase
          ln -s ../database/migrations ./supabase/migrations

      - name: Deploy Migrations
        # CLI v3: sem `--remote` o push vai para o banco local (que não existe aqui), e mudança em
        # projeto hospedado só passa com `--yes` quando não há ninguém para confirmar
        run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
