name: Crowdin status

# Reminder, never a blocker: every PR gets warnings when translations are waiting somewhere.
# - a Crowdin pull request (l10n/crowdin) is open → merge it
# - strings were translated on Crowdin and wait for a proofreader → approve them on Crowdin
# Only cheap API calls: no Crowdin build per push (they hit "Too Many Project Builds"). To bring
# approved translations, comment /sync-crowdin (see crowdin.yml).
# Pull requests from forks get no secrets, so the Crowdin checks are skipped there.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: crowdin-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    # The Crowdin pull request itself has nothing to be reminded of
    if: github.head_ref != 'l10n/crowdin'
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Crowdin pull request waiting for merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head l10n/crowdin --state open \
            --json number,url --jq '.[0] // empty | "#\(.number) \(.url)"')
          if [ -n "$pr" ]; then
            echo "::warning title=Crowdin::Pull request de traduções aberto esperando merge: $pr"
            echo "- ⚠️ PR do Crowdin aberto esperando merge: $pr" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Strings waiting for review on Crowdin
        if: env.CROWDIN_PERSONAL_TOKEN != ''
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CROWDIN_PERSONAL_TOKEN" \
            "https://api.crowdin.com/api/v2/projects/$CROWDIN_PROJECT_ID/languages/progress?limit=500" \
            > "$RUNNER_TEMP/progress.json"
          {
            echo "### Crowdin"
            echo "| Idioma | Traduzido | Aprovado |"
            echo "|---|---|---|"
            jq -r '.data[].data | "| `\(.languageId)` | \(.translationProgress)% | \(.approvalProgress)% |"' \
              "$RUNNER_TEMP/progress.json"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.data[].data
                | select(.phrases.translated > .phrases.approved)
                | "\(.languageId)\t\(.phrases.translated - .phrases.approved)"' \
            "$RUNNER_TEMP/progress.json" \
            | while IFS=$'\t' read -r lang pending; do
                echo "::warning title=Crowdin::$lang: $pending string(s) traduzida(s) esperando aprovação no Crowdin"
                echo "- 📝 \`$lang\`: $pending string(s) esperando aprovação no Crowdin" >> "$GITHUB_STEP_SUMMARY"
              done
