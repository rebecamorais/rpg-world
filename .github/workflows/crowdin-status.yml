name: Crowdin status

# Reminder, never a blocker: every PR gets warnings when translations are waiting somewhere.
# - a Crowdin pull request (l10n/crowdin) is open → merge it
# - Crowdin has approved translations that are not in the repository → run the Crowdin workflow
# - strings were translated on Crowdin and wait for a proofreader → approve them on Crowdin
# Pull requests from forks get no secrets, so the Crowdin checks are skipped there.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: crowdin-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    # The Crowdin pull request itself has nothing to be reminded of
    if: github.head_ref != 'l10n/crowdin'
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Crowdin pull request waiting for merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head l10n/crowdin --state open \
            --json number,url --jq '.[0] // empty | "#\(.number) \(.url)"')
          if [ -n "$pr" ]; then
            echo "::warning title=Crowdin::Pull request de traduções aberto esperando merge: $pr"
            echo "- ⚠️ PR do Crowdin aberto esperando merge: $pr" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Strings waiting for review on Crowdin
        if: env.CROWDIN_PERSONAL_TOKEN != ''
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CROWDIN_PERSONAL_TOKEN" \
            "https://api.crowdin.com/api/v2/projects/$CROWDIN_PROJECT_ID/languages/progress?limit=500" \
            | jq -r '.data[].data
                | select(.phrases.translated > .phrases.approved)
                | "\(.languageId)\t\(.phrases.translated - .phrases.approved)"' \
            | while IFS=$'\t' read -r lang pending; do
                echo "::warning title=Crowdin::$lang: $pending string(s) traduzida(s) esperando aprovação no Crowdin"
                echo "- 📝 \`$lang\`: $pending string(s) esperando aprovação no Crowdin" >> "$GITHUB_STEP_SUMMARY"
              done

      # Downloads the approved translations into the workspace only: nothing is committed or pushed
      - name: Download approved translations
        if: env.CROWDIN_PERSONAL_TOKEN != ''
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788 # v3.5.0
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          export_only_approved: true
          push_translations: false
          create_pull_request: false

      - name: Approved translations missing from the repository
        if: env.CROWDIN_PERSONAL_TOKEN != ''
        run: |
          set -euo pipefail
          # Counts the strings Crowdin has a real translation for (not the English fallback) that
          # differ from the repository. Formatting, and keys a PR adds before Crowdin knows them,
          # never count.
          total=0
          lines=()
          while IFS= read -r file; do
            case "$file" in
              messages/*) en="messages/en.json" ;;
              *) en=$(echo "$file" | sed -E 's#/i18n/[a-z]{2}/#/i18n/en/#') ;;
            esac
            [ -f "$en" ] || continue
            git show "HEAD:$file" > "$RUNNER_TEMP/old.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/old.json"
            count=$(jq -n --slurpfile new "$file" --slurpfile en "$en" --slurpfile old "$RUNNER_TEMP/old.json" '
              $new[0] as $n | $en[0] as $e | $old[0] as $o
              | [$n | paths(scalars) as $p
                  | ($n | getpath($p)) as $v
                  | select($v != ($e | getpath($p)) and $v != ($o | getpath($p)))]
              | length')
            if [ "$count" -gt 0 ]; then
              total=$((total + count))
              lines+=("  - \`$file\`: $count")
            fi
          done < <(git status --porcelain --untracked-files=all -- messages content \
            | awk '{print $2}' | grep '\.json$' | grep -v '/en\.json$' | grep -v '/i18n/en/' || true)

          if [ "$total" -gt 0 ]; then
            echo "::warning title=Crowdin::$total string(s) aprovada(s) no Crowdin que não estão no repositório. Rode Actions → Crowdin → Run workflow."
            {
              echo "- 🌍 $total string(s) aprovada(s) no Crowdin fora do repositório (rode o workflow **Crowdin**):"
              printf '%s\n' "${lines[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
