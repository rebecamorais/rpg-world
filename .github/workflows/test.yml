name: CI - RPG World Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54421
      SUPABASE_URL: http://localhost:54421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_test
      GOOGLE_CLIENT_ID: mock
      GOOGLE_CLIENT_SECRET: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Lint
        run: npm run lint

      # Unused files, exports and dependencies (config in knip.json)
      - name: Check Dead Code
        run: npm run knip

      # 1. Rodar Testes Unitários Primeiro (Fail Fast)
      # Same unit tests, plus the coverage floor from test/vitest.config.unit.ts
      - name: Run Unit Tests (with coverage floor)
        run: npm run test:coverage

      # 2. Preparar Infraestrutura de Integração
      - name: Initialize Database Structure (Symlinks)
        run: npm run infra sync

      - name: Start Supabase Test Environment
        run: npx supabase start --workdir database/db-test

      # Garante que lib/types/database.ts está em sincronia com as migrations
      - name: Check Database Types Are Up To Date
        run: |
          npx supabase gen types typescript --local --schema public --workdir database/db-test > lib/types/database.ts
          npx prettier --write lib/types/database.ts
          git diff --exit-code lib/types/database.ts || (echo "::error::lib/types/database.ts está desatualizado. Rode 'npm run infra up' e commite o arquivo." && exit 1)

      # 3. Rodar Testes de Integração
      - name: Run Integration Tests
        run: npm run test:integration

  # Ponta a ponta com Playwright: build de produção + Supabase de teste.
  # Informativo por enquanto: não está entre os checks obrigatórios do ruleset.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # The browser is cached per Playwright version; only the system libraries are installed on a
      # hit. Downloading Chromium on every run sometimes hung for 10+ minutes.
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Initialize Database Structure (Symlinks)
        run: npm run infra sync

      - name: Start Supabase Test Environment
        run: npx supabase start --workdir database/db-test

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
