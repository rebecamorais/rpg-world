name: Preview Migrations

# Os previews dos PRs usam um projeto Supabase de staging, separado da produção.
# Aplica lá as migrations do PR, para o preview já ter o schema novo,
# e as da main depois de cada merge, para o staging não ficar para trás.
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/**'
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'

# Um push de migrations por vez no staging
concurrency:
  group: staging-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # PR de fork não recebe os secrets
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        # Sem `version`, o v3 usa a versão do CLI fixada no package-lock.json
        uses: supabase/setup-cli@v3

      - name: Link Staging Project
        run: supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} -p ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Create Symlink for Supabase CLI
        run: |
          mkdir -p supabase
          ln -s ../database/migrations ./supabase/migrations

      # --include-all aceita migrations com data anterior à última aplicada,
      # comum quando dois PRs abertos ao mesmo tempo criam migrations
      - name: Deploy Migrations to Staging
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
