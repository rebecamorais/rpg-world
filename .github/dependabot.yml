version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    reviewers:
      - 'rebecamorais'
    assignees:
      - 'rebecamorais'
    commit-message:
      prefix: 'chore(deps):'
    labels:
      - 'dependencies'
      - 'javascript'
      - 'typescript'
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      tailwind:
        patterns:
          - 'tailwindcss*'
          - '@tailwindcss/*'
          - 'tailwind-merge'
          - 'postcss*'
      react-next:
        patterns:
          - 'react*'
          - 'next*'
      testing:
        patterns:
          - 'vitest*'
          - '@vitest/*'
      # Demais atualizações minor/patch num PR só, para não acumular PRs
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Mantido na linha 24.x para acompanhar engines.node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Os plugins do eslint-config-next ainda não suportam ESLint 10
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # typescript-eslint ainda não suporta TypeScript 7
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    commit-message:
      prefix: 'chore(deps):'
    groups:
      github-actions:
        patterns:
          - '*'
