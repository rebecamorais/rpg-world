<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="necromancyRing" x1="44" y1="40" x2="196" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CCA6FF"/>
      <stop offset="0.45" stop-color="#9E6AE2"/>
      <stop offset="1" stop-color="#5E327F"/>
    </linearGradient>
    <linearGradient id="necromancyAccent" x1="66" y1="60" x2="176" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9D7FF"/>
      <stop offset="1" stop-color="#7A4DB3"/>
    </linearGradient>
  </defs>

  <!-- outer broken ring -->
  <path d="M120 26C79 26 44.6 47.7 30.8 80" stroke="url(#necromancyRing)" stroke-width="6" stroke-linecap="round"/>
  <path d="M25.5 102C24.5 108 24 114 24 120c0 53 43 96 96 96 42.6 0 78.7-27.8 91.1-66.2" stroke="url(#necromancyRing)" stroke-width="6" stroke-linecap="round"/>
  <path d="M214.2 129.5c.5-3.1.8-6.3.8-9.5 0-23.6-8.5-45.1-22.6-61.8" stroke="url(#necromancyRing)" stroke-width="6" stroke-linecap="round"/>

  <!-- inner broken ring -->
  <path d="M120 51c-28.2 0-52.8 14.8-66.6 37.1" stroke="url(#necromancyAccent)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M46.2 105.5A74.4 74.4 0 0 0 45 120c0 41.4 33.6 75 75 75 31 0 57.6-18.8 69-45.7" stroke="url(#necromancyAccent)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M190.9 132.3c2.7-8.5 4.1-17.5 4.1-26.8 0-18.4-5.4-35.5-14.8-49.8" stroke="url(#necromancyAccent)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- central crossing lines / seal structure -->
  <g stroke="url(#necromancyAccent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 67v106" stroke-width="3.2"/>
    <path d="M67 120h106" stroke-width="3.2"/>
    <path d="M82 82l76 76" stroke-width="2.4" stroke-opacity="0.8"/>
    <path d="M158 82l-76 76" stroke-width="2.4" stroke-opacity="0.8"/>
    <path d="M120 86l14 20-14 14-14-14 14-20Z" stroke-width="2.4" fill="#9E6AE2" fill-opacity="0.08"/>
    <path d="M120 120l18 18-18 16-18-16 18-18Z" stroke-width="2.4" fill="#9E6AE2" fill-opacity="0.08"/>
    <circle cx="120" cy="120" r="7" stroke-width="2.6"/>
  </g>

  <!-- runes around the ring -->
  <g stroke="url(#necromancyRing)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
    <!-- top -->
    <path d="M116 38h8"/>
    <path d="M120 34v8"/>
    <!-- top-right -->
    <path d="M163 50l6 4"/>
    <path d="M166 46l-1 12"/>
    <!-- right -->
    <path d="M194 116v8"/>
    <path d="M190 120h8"/>
    <!-- bottom-right -->
    <path d="M170 182l-8 4"/>
    <path d="M166 176l1 12"/>
    <!-- bottom -->
    <path d="M116 202h8"/>
    <path d="M120 198v8"/>
    <!-- bottom-left -->
    <path d="M70 182l8 4"/>
    <path d="M74 176l-1 12"/>
    <!-- left -->
    <path d="M42 116v8"/>
    <path d="M38 120h8"/>
    <!-- top-left -->
    <path d="M77 50l-6 4"/>
    <path d="M74 46l1 12"/>
  </g>

  <!-- small diamonds / anchor marks -->
  <g fill="#CCA6FF" fill-opacity="0.9">
    <path d="M120 19l4 5-4 5-4-5 4-5Z"/>
    <path d="M221 120l-5 4-5-4 5-4 5 4Z"/>
    <path d="M120 221l-4-5 4-5 4 5-4 5Z"/>
    <path d="M19 120l5-4 5 4-5 4-5-4Z"/>
