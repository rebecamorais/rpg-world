<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="divinationOrbit" x1="34" y1="30" x2="209" y2="211" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF1FF"/>
      <stop offset="0.48" stop-color="#B6C7F4"/>
      <stop offset="1" stop-color="#647FAF"/>
    </linearGradient>
    <linearGradient id="divinationEye" x1="46" y1="87" x2="194" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A9ED1"/>
      <stop offset="0.48" stop-color="#D6DDFF"/>
      <stop offset="1" stop-color="#6277A8"/>
    </linearGradient>
    <linearGradient id="divinationIris" x1="96" y1="93" x2="149" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F0CF"/>
      <stop offset="0.52" stop-color="#B4C5EE"/>
      <stop offset="1" stop-color="#657EB8"/>
    </linearGradient>
  </defs>

  <!-- Open celestial astrolabe: not a full ritual circle -->
  <g stroke="url(#divinationOrbit)" stroke-linecap="round" fill="none">
    <path d="M40 86C50 51 80 30 113 27" stroke-width="3.5"/>
    <path d="M128 27c35 3 63 27 73 59" stroke-width="3.5"/>
    <path d="M202 154c-11 32-40 55-74 59" stroke-width="3.5"/>
    <path d="M111 213c-34-3-62-26-73-57" stroke-width="3.5"/>
    <path d="M62 76c13-22 33-35 58-35" stroke-width="1.6" opacity="0.72"/>
    <path d="M138 42c22 5 41 18 51 39" stroke-width="1.6" opacity="0.72"/>
    <path d="M184 163c-11 19-28 31-49 36" stroke-width="1.6" opacity="0.72"/>
    <path d="M105 199c-21-5-39-18-50-37" stroke-width="1.6" opacity="0.72"/>
  </g>

  <!-- Celestial compass and starmap marks -->
  <g stroke="#8BA5D9" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M38 66l11-4 5-13"/>
    <path d="M186 50l7 13 12 4"/>
    <path d="M50 191l9-11-3-12"/>
    <path d="M188 175l-3 13-11 5"/>
    <path d="M70 48l6 9 10-2"/>
    <path d="M155 41l-5 11 9 6"/>
    <path d="M70 194l10-5 5 9"/>
    <path d="M158 183l-7 9 8 5"/>
  </g>

  <!-- Rising and setting star - the timeline of possible futures -->
  <path d="M120 11l4.7 13.3L138 29l-13.3 4.7L120 47l-4.7-13.3L102 29l13.3-4.7L120 11Z"
        fill="url(#divinationIris)" fill-opacity="0.9"/>
  <path d="M120 193l3.3 9.7 9.7 3.3-9.7 3.3-3.3 9.7-3.3-9.7-9.7-3.3 9.7-3.3 3.3-9.7Z"
        stroke="url(#divinationOrbit)" stroke-width="1.7"/>

  <!-- Large clairvoyant eye / lens -->
  <path d="M37 120c18-27 47-46 83-46s65 19 83 46c-18 27-47 46-83 46s-65-19-83-46Z"
        fill="#657EB8" fill-opacity="0.07" stroke="url(#divinationEye)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M44 120c21-16 47-26 76-26s55 10 76 26" stroke="#B9C8EF" stroke-opacity="0.65" stroke-width="1.6"/>
  <path d="M44 120c21 16 47 26 76 26s55-10 76-26" stroke="#6D87B6" stroke-opacity="0.7" stroke-width="1.6"/>

  <!-- Iris ring and inner focus lines -->
  <circle cx="120" cy="120" r="34" stroke="url(#divinationOrbit)" stroke-width="2.8"/>
  <circle cx="120" cy="120" r="26.5" stroke="#839CCB" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.82"/>
  <circle cx="120" cy="120" r="15" fill="#7C96CB" fill-opacity="0.16" stroke="url(#divinationIris)" stroke-width="2.2"/>
  <path d="M120 98l5.7 16.3L142 120l-16.3 5.7L120 142l-5.7-16.3L98 120l16.3-5.7L120 98Z"
        fill="url(#divinationIris)"/>
  <circle cx="120" cy="120" r="3.7" fill="#50699A"/>

  <!-- Lines of sight extend to different possible paths -->
  <g stroke="url(#divinationOrbit)" stroke-linecap="round" fill="none">
    <path d="M43 119l-18-10-12 4" stroke-width="1.8"/>
    <path d="M43 121l-19 10-10-4" stroke-width="1.8"/>
    <path d="M197 119l18-10 12 4" stroke-width="1.8"/>
    <path d="M197 121l19 10 10-4" stroke-width="1.8"/>
    <path d="M120 74V58" stroke-width="1.5" opacity="0.66"/>
    <path d="M120 166v16" stroke-width="1.5" opacity="0.66"/>
  </g>

  <!-- Constellation stars and threads, deliberately asymmetrical -->
  <g stroke="#849DC9" stroke-opacity="0.72" stroke-width="1.3" fill="none">
    <path d="M34 79l-12 10 12 13"/>
    <path d="M206 80l12 10-12 12"/>
    <path d="M68 188l-14 10 7 14"/>
    <path d="M173 187l15 10-8 14"/>
  </g>
  <g fill="#E8ECFF">
    <circle cx="34" cy="79" r="2.8"/>
    <circle cx="22" cy="89" r="2"/>
    <circle cx="34" cy="102" r="2.6"/>
    <circle cx="206" cy="80" r="2.6"/>
    <circle cx="218" cy="90" r="2"/>
    <circle cx="206" cy="102" r="2.6"/>
    <circle cx="68" cy="188" r="2.2"/>
    <circle cx="54" cy="198" r="2"/>
    <circle cx="61" cy="212" r="2"/>
    <circle cx="173" cy="187" r="2.2"/>
    <circle cx="188" cy="197" r="2"/>
    <circle cx="180" cy="211" r="2"/>
  </g>
  <g stroke="url(#divinationOrbit)" stroke-width="1.5" stroke-linecap="round">
    <path d="M73 28v8m-4-4h8"/>
    <path d="M164 29v8m-4-4h8"/>
    <path d="M35 169v7m-3.5-3.5h7"/>
    <path d="M205 168v7m-3.5-3.5h7"/>
  </g>
</svg>
