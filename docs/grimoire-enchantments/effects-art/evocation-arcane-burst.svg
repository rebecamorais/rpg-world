      <stop offset="0" stop-color="#FFE1A8"/>
      <stop offset="0.48" stop-color="#FFAE4D"/>
      <stop offset="1" stop-color="#C4621A"/>
    </linearGradient>
    <linearGradient id="evInner" x1="68" y1="58" x2="178" y2="186" gradientUnits="userSpaceOnUse">
