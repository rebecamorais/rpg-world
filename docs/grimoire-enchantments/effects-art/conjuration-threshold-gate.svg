<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="gateArch" x1="47" y1="24" x2="193" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9F8F1"/>
      <stop offset="0.46" stop-color="#7CDACA"/>
      <stop offset="1" stop-color="#327C91"/>
    </linearGradient>
    <linearGradient id="gatePlanes" x1="95" y1="67" x2="164" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2FFF2"/>
      <stop offset="0.52" stop-color="#79CFC9"/>
      <stop offset="1" stop-color="#2F789B"/>
    </linearGradient>
    <linearGradient id="gateShadows" x1="63" y1="47" x2="169" y2="201" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#589BA8"/>
      <stop offset="1" stop-color="#275B81"/>
    </linearGradient>
  </defs>

  <!-- Four calibrated corner brackets, not a circular rune ring -->
  <g stroke="url(#gateShadows)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <path d="M44 68V44h24M172 44h24v24M44 172v24h24M172 196h24v-24"/>
    <path d="M36 87v-8M204 79v8M36 153v8M204 161v-8"/>
  </g>

  <!-- Exterior dimensional threshold: pointed gothic portal, interrupted at floor -->
  <path d="M54 190V113C54 76 73 49 120 20C167 49 186 76 186 113v77"
        stroke="url(#gateArch)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 183v-67c0-31 17-53 54-78c37 25 54 47 54 78v67"
        stroke="url(#gateArch)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
  <path d="M80 178v-62c0-24 12-42 40-62c28 20 40 38 40 62v62"
        stroke="url(#gateShadows)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Threshold plinth: a tangible crossing, not another circle -->
  <path d="M61 199l21-12h76l21 12-20 10H81l-20-10Z" fill="#327C91" fill-opacity="0.16"
        stroke="url(#gateArch)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M83 187l14-7h46l15 7M89 199h62" stroke="url(#gatePlanes)" stroke-width="1.7" stroke-linecap="round" opacity="0.72"/>
  <path d="M105 209v9M120 209v12M135 209v9" stroke="#589BA8" stroke-width="1.4" opacity="0.6"/>

  <!-- Dimensional fold: front and back geometries are visibly misaligned -->
  <path d="M120 72L150 101L137 157L109 176L89 134L100 97Z"
        fill="#2F789B" fill-opacity="0.09" stroke="url(#gateShadows)" stroke-width="2.1" stroke-linejoin="round"/>
  <path d="M133 78L158 113L142 166L114 178L99 135L111 104Z"
        fill="url(#gatePlanes)" fill-opacity="0.13" stroke="url(#gateArch)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M133 78L111 104L99 135L114 178L120 136Z" fill="#327C91" fill-opacity="0.16"/>
  <path d="M133 78L158 113L142 166L114 178L120 136Z" fill="#C2FFF2" fill-opacity="0.10"/>
  <path d="M111 104L158 113L120 136L99 135M120 136L114 178M133 78L120 136"
        stroke="url(#gatePlanes)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <!-- The line where the portal intersects the near plane -->
  <path d="M100 135L120 136L158 113" stroke="#D9F8F1" stroke-width="2.2" stroke-linecap="round" opacity="0.78"/>

  <!-- Detatched traversing facets, one side physically entering and the other exiting -->
  <path d="M86 100l11-17l11 8l-7 19Z" fill="url(#gatePlanes)" fill-opacity="0.28" stroke="url(#gateArch)" stroke-width="1.7"/>
  <path d="M158 130l17-9l6 13l-14 13Z" fill="url(#gatePlanes)" fill-opacity="0.25" stroke="url(#gateArch)" stroke-width="1.8"/>
  <path d="M79 152l13-5l7 15l-14 9Z" fill="#589BA8" fill-opacity="0.22" stroke="url(#gateShadows)" stroke-width="1.4"/>
  <path d="M168 86l8-11l8 8l-8 14Z" fill="#79CFC9" fill-opacity="0.19" stroke="url(#gateArch)" stroke-width="1.3"/>

  <!-- Slim crossing lines indicate teleportation, unlike protective hexagons -->
  <g stroke="url(#gateArch)" stroke-linecap="round" opacity="0.8">
    <path d="M74 128l20-8M72 139l22-9M164 113l20-8M163 123l18-8" stroke-width="1.9"/>
    <path d="M96 74l9-12M145 67l8 12M100 176l-8 9M148 172l8 10" stroke-width="1.5" opacity="0.65"/>
  </g>

  <!-- Four portal anchor sigils; simple, original geometry -->
  <g stroke="url(#gatePlanes)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120 16l5 6l-5 7l-5-7l5-6Z"/>
    <path d="M40 119l6-6l6 6l-6 6l-6-6Z"/>
    <path d="M188 119l6-6l6 6l-6 6l-6-6Z"/>
    <path d="M120 218l4 5l-4 5l-4-5l4-5Z"/>
    <path d="M82 51l6-1l4 6l-6 1l-4-6ZM148 56l4-6l6 1l-4 6l-6-1Z"/>
  </g>
  <g fill="#D9F8F1" opacity="0.85">
    <circle cx="70" cy="88" r="2.2"/>
    <circle cx="182" cy="154" r="2.5"/>
    <circle cx="154" cy="61" r="1.6"/>
    <circle cx="91" cy="177" r="1.8"/>
  </g>
</svg>
