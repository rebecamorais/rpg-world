<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="charmweaveMain" x1="26" y1="44" x2="218" y2="197" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9D9F5"/>
      <stop offset="0.46" stop-color="#DDA0E6"/>
      <stop offset="1" stop-color="#A75DBE"/>
    </linearGradient>
    <linearGradient id="charmweaveShadow" x1="48" y1="60" x2="196" y2="187" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDA0E6"/>
      <stop offset="1" stop-color="#704180"/>
    </linearGradient>
    <linearGradient id="charmweaveGem" x1="98" y1="96" x2="145" y2="147" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9D9F5"/>
      <stop offset="0.55" stop-color="#DDA0E6"/>
      <stop offset="1" stop-color="#A75DBE"/>
    </linearGradient>
  </defs>

  <!-- enchantment: interlaced charm ribbons, not a portal or a warding circle -->
  <!-- broad flowing outer ribbons -->
  <g stroke="url(#charmweaveMain)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 119C97 92 82 73 59 71C38 69 26 84 31 101C38 121 70 131 95 120C114 112 122 94 116 79C111 67 98 60 87 62" stroke-width="5.3"/>
    <path d="M122 119C143 92 158 73 181 71C202 69 214 84 209 101C202 121 170 131 145 120C126 112 118 94 124 79C129 67 142 60 153 62" stroke-width="5.3"/>
    <path d="M118 121C95 149 81 167 61 169C43 170 32 160 36 144C41 128 61 125 78 130C91 134 98 145 96 156" stroke-width="4.4"/>
    <path d="M122 121C145 149 159 167 179 169C197 170 208 160 204 144C199 128 179 125 162 130C149 134 142 145 144 156" stroke-width="4.4"/>
  </g>

  <!-- second layer: fine arcwork and negative space -->
  <g stroke="url(#charmweaveShadow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.15">
    <path d="M107 116C93 99 75 86 60 90C50 93 49 103 56 109C64 115 76 115 87 109"/>
    <path d="M133 116C147 99 165 86 180 90C190 93 191 103 184 109C176 115 164 115 153 109"/>
    <path d="M107 130C91 146 76 156 64 150C57 147 57 140 62 137"/>
    <path d="M133 130C149 146 164 156 176 150C183 147 183 140 178 137"/>
    <path d="M61 62C75 47 91 43 105 49"/>
    <path d="M179 62C165 47 149 43 135 49"/>
    <path d="M67 179C80 190 94 194 107 189"/>
    <path d="M173 179C160 190 146 194 133 189"/>
  </g>

  <!-- raised crown of linked charms; not a complete enclosing ring -->
  <g stroke="url(#charmweaveMain)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89 48C101 35 112 36 120 22C128 36 139 35 151 48" stroke-width="3.0"/>
    <path d="M89 192C101 205 112 204 120 218C128 204 139 205 151 192" stroke-width="3.0"/>
  </g>

  <!-- center: spell of influence / faceted diamond that locks both halves -->
  <path d="M120 83L136 106L133 133L120 158L107 133L104 106L120 83Z" fill="url(#charmweaveGem)" fill-opacity="0.21" stroke="url(#charmweaveMain)" stroke-width="3.1" stroke-linejoin="round"/>
  <path d="M120 92L128 109L120 119L112 109L120 92Z" fill="#DDA0E6" fill-opacity="0.32" stroke="#F9D9F5" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M120 119L128 130L120 148L112 130L120 119Z" fill="#A75DBE" fill-opacity="0.2" stroke="url(#charmweaveShadow)" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M104 120H94M136 120H146" stroke="#F9D9F5" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 75V66M120 167V175" stroke="#DDA0E6" stroke-width="2" stroke-linecap="round"/>

  <!-- four mind-binding teardrop charms -->
  <g fill="#DDA0E6" fill-opacity="0.22" stroke="url(#charmweaveMain)" stroke-width="2.1" stroke-linejoin="round">
    <path d="M48 54L55 63L48 72L41 63L48 54Z"/>
    <path d="M192 54L199 63L192 72L185 63L192 54Z"/>
    <path d="M48 168L55 177L48 186L41 177L48 168Z"/>
    <path d="M192 168L199 177L192 186L185 177L192 168Z"/>
  </g>

  <!-- scattered charm motes; deliberately sparse -->
  <g fill="#F9D9F5">
    <circle cx="25" cy="120" r="2.4"/>
    <circle cx="215" cy="120" r="2.4"/>
    <circle cx="78" cy="37" r="2.1"/>
    <circle cx="162" cy="37" r="2.1"/>
    <circle cx="78" cy="202" r="2.1"/>
    <circle cx="162" cy="202" r="2.1"/>
  </g>

  <!-- fine sympathetic links -->
  <g stroke="#A75DBE" stroke-width="1.6" stroke-linecap="round" opacity="0.86">
    <path d="M32 120h12M196 120h12"/>
    <path d="M48 78v8M192 78v8M48 153v8M192 153v8"/>
    <path d="M96 35l5 6M144 35l-5 6M96 204l5-6M144 204l-5-6"/>
  </g>
</svg>
