      <stop offset="0" stop-color="#D6CCFF"/>
      <stop offset="0.46" stop-color="#A18BEB"/>
      <stop offset="1" stop-color="#5F4BA6"/>
    </linearGradient>
    <linearGradient id="illusionInner" x1="66" y1="54" x2="176" y2="188" gradientUnits="userSpaceOnUse">
