  <path d="M120 111V127M112 119H128" stroke="#E9F4FF" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Four locks around the ward, designed as abstract original runes -->
  <g stroke="url(#aegisOuter)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 82L79 79L72 86L79 93L86 90"/>
    <path d="M154 82L161 79L168 86L161 93L154 90"/>
    <path d="M86 152L79 149L72 156L79 163L86 160"/>
    <path d="M154 152L161 149L168 156L161 163L154 160"/>
  </g>
  <g fill="#C6E2FC">
    <path d="M120 10L124 16L120 22L116 16L120 10Z"/>
    <path d="M120 231L116 225L120 219L124 225L120 231Z"/>
    <path d="M30 119L36 115L42 119L36 123L30 119Z"/>
    <path d="M210 119L204 115L198 119L204 123L210 119Z"/>
  </g>
  <!-- Narrow light flecks suggest deflected magic, no continuous animation or filters -->
  <g stroke="#E9F4FF" stroke-width="1.6" stroke-opacity="0.78" stroke-linecap="round">
    <path d="M67 50L73 54"/>
    <path d="M173 50L167 54"/>
    <path d="M58 185L65 191"/>
    <path d="M182 185L175 191"/>
